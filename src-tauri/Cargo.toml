[package]
name = "sxmcaps"
version = "0.2.1"
description = "sxmcaps - Low-latency mechanical keyboard & mouse sound simulator"
authors = ["sxmcaps"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "sxmcaps_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
rodio = { version = "0.20", default-features = false, features = ["vorbis", "wav", "mp3", "flac", "symphonia-mp3", "symphonia-aac", "symphonia-flac", "symphonia-wav"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
fastrand = "2"
libc = "0.2"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
